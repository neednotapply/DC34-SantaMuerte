[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNFC_DEBUG_VERBOSE=true

monitor_speed = 115200
; On this S3 the USB-Serial-JTAG bridge resets the chip whenever the host
; DE-asserts DTR -- measured 4/4 with DTR=0 and 0/4 with DTR=1, RTS makes no
; difference. monitor_dtr = 0 therefore reboots the badge every time a monitor
; attaches or detaches, which looks exactly like a spontaneous crash. Hold both
; lines asserted so attaching a monitor is a passive act.
monitor_rts = 1
monitor_dtr = 1

; Build the contents of /data as a LittleFS filesystem image.
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit NeoPixel@^1.13.0
    adafruit/Adafruit BusIO@^1.17.1
    adafruit/Adafruit PN532@^1.3.4
