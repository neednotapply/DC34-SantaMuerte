[env:esp32-s3-devkitm-1]
; Arduino 3 / ESP-IDF 5 ships TinyUSB's NCM device class. It keeps the badge's
; existing CDC serial and HID functions while adding the USB Wi-Fi adapter.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino

; The esp32-s3-devkitm-1 board definition injects -DARDUINO_USB_MODE=1 (fixed
; USB-Serial-JTAG). Strip it so our -DARDUINO_USB_MODE=0 below is the only
; definition -- otherwise both reach the compiler and it warns on every file.
build_unflags = -DARDUINO_USB_MODE=1

build_flags =
    ; TinyUSB (USB-OTG), not the fixed-function USB-Serial-JTAG bridge. Only the
    ; OTG stack can present HID, and it does so as a COMPOSITE device: the USB
    ; Altar console (CDC) and the rubber-ducky keyboard/mouse/consumer share one
    ; cable. Consequence: Serial becomes the TinyUSB CDC (USBCDC), not HWCDC.
    ;
    ; The core auto-calls USB.begin() at boot (before setup()) because CDC-on-boot
    ; is set. That is fine here: the HID interfaces are reserved in the HID
    ; objects' CONSTRUCTORS, which run during static init -- before that boot-time
    ; begin() -- so the composite descriptor already includes keyboard/mouse/
    ; consumer. usbHidBegin() then only wires up the report path in setup().
    -DARDUINO_USB_MODE=0
    ; USB is started manually after NVS selects the Network or Drive profile.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Default device name, used whenever no custom USB identity is saved (see
    ; getUsbIdentitySettings() in usb_hid.cpp). Confirmed on hardware that
    ; USB.productName()/manufacturerName()/serialNumber() called from setup()
    ; before USB.begin() DO override these at runtime, the same as USB.PID()
    ; already does -- so a saved identity does not require a firmware rebuild.
    '-DUSB_PRODUCT="Santa Muerte Badge"'
    '-DUSB_MANUFACTURER="Sneakreaper Industries"'
    -DNFC_DEBUG_VERBOSE=true
    -DSM_USB_NCM=1
    -DSM_USB_DRIVE=1

monitor_speed = 115200
; Under the old USB-Serial-JTAG bridge, DE-asserting DTR rebooted the chip, so a
; monitor attaching looked like a spontaneous crash; monitor_dtr=1/monitor_rts=1
; held both lines asserted to make attaching passive. TinyUSB CDC does not reset
; on DTR at all, so that hazard is gone -- the lines are kept asserted only
; because it stays harmless and keeps the dev loop identical. Note the flashing
; story changes with OTG mode: there is no always-on JTAG serial, so if an
; upload cannot auto-reset the board into download mode, hold BOOT and tap RESET
; (or EN) to enter it manually, then flash.
monitor_rts = 1
monitor_dtr = 1

; Build the contents of /data as a LittleFS filesystem image.
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit NeoPixel@^1.13.0
    adafruit/Adafruit BusIO@^1.17.1
    ; Adafruit PN532 is vendored in lib/Adafruit_PN532 (SM-FORK: exposes SAK).
    bitbank2/JPEGDEC@^1.8.4
