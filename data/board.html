<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8">
  <!-- The portal carries its own ES/EN layer, so a browser translating on top
       of it corrupts the page: it rewrites text locale.js is also rewriting,
       and its language detector has mistaken the decorated headings for CJK
       and spelled the animation indices out as words. -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151615">
  <title>Santa Muerte // Field Notes</title>
  <link rel="stylesheet" href="theme.css?v=46">
  <link rel="icon" type="image/png" href="assets/logo-candle.png">
  <script src="locale.js?v=35"></script>
  <script src="tape.js?v=3"></script>
  <style>
    :root{
      color-scheme:dark;
      --bg:#151615;
      --panel:#1e1f1c;
      --line:#504d44;
      --line-soft:#343530;
      --text:#ece6d8;
      --muted:#a9a397;
      --faint:#78746b;
      --violet:#6f1d24;
      --pink:#6f1d24;
      --green:#91a67d;
      --amber:#a47b36;
      --danger:#b85a4d;
    }
    *{box-sizing:border-box}
    /* Several blocks here set display, which would otherwise beat the user
       agent's [hidden] rule and leave them on screen. */
    [hidden]{display:none!important}
    html{min-height:100%;background:var(--bg);overscroll-behavior-y:none}
    body{
      margin:0;
      min-height:100vh;
      padding:20px 16px 64px;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:15px;
      line-height:1.5;
      overscroll-behavior-y:none;
      background:linear-gradient(90deg,#101110,#151615 52%,#101110);
      background-attachment:fixed;
    }
    /* Width itself is set in theme.css, which owns the corridor. What matters
       here is that only the wall uses it: the things you act on rather than
       read keep a hand's width so the composer does not become a billboard. */
    main{margin:0 auto;display:grid;gap:16px}
    main > .card,
    main > .more{width:min(680px,100%);margin-inline:auto}

    header{display:grid;gap:12px}
    .titlebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    h1{margin:0;font-size:1.5rem;font-weight:850;letter-spacing:-.03em}
    h2{margin:0 0 14px;font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
    .subtitle{color:var(--muted);font-size:.84rem}
    /* The notes are taped to the corridor wall, not the contents of
       a panel. Card chrome around them read as a second frame drawn inside the
       page. min-width:0 is kept from .card so a long word cannot widen the
       grid column. */
    .hall{min-width:0}
    .card{
      border:1px solid var(--line);border-radius:18px;padding:16px;
      background:linear-gradient(145deg,var(--panel),rgba(13,14,23,.94));
      box-shadow:0 18px 55px rgba(0,0,0,.32);
    }

    label{display:block;font-size:.76rem;font-weight:700;letter-spacing:.04em;
      text-transform:uppercase;color:var(--faint);margin:0 0 6px}
    textarea,input[type=text]{
      width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;
      background:rgba(0,0,0,.34);color:var(--text);font:inherit;font-size:.95rem;
      resize:vertical;
    }
    textarea:focus,input[type=text]:focus{outline:none;border-color:var(--violet)}
    textarea{min-height:88px}
    .field{margin-bottom:12px}
    .mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px}
    .mode-button{
      min-height:40px;padding:8px 6px;border:1px solid var(--line);border-radius:2px;
      color:var(--muted);background:rgba(255,255,255,.04);font-size:.75rem;
      font-weight:800;letter-spacing:.09em;text-transform:uppercase;cursor:pointer
    }
    .mode-button.active,.mode-button:hover,.mode-button:focus-visible{
      color:var(--text);border-color:var(--violet);background:rgba(111,29,36,.12);outline:none
    }
    .paper-surface{position:relative}
    .paper-text{
      position:absolute;inset:0;width:100%;height:100%;padding:18px 20px;
      border:0;border-radius:2px;resize:none;background:transparent;color:transparent;
      caret-color:transparent;font:700 1rem/1.65 var(--sm-mono,"Courier New",monospace);
      letter-spacing:.02em;overflow:hidden;pointer-events:none
    }
    .paper-text.typing{pointer-events:auto}
    .paper-text:focus{outline:2px solid var(--sm-brass,#a47b36);outline-offset:2px}
    .field-foot{display:flex;justify-content:space-between;gap:10px;
      margin-top:5px;font-size:.76rem;color:var(--faint)}
    .over{color:var(--danger)}

    /* Keep the file input in the layout. Some Android WebViews refuse to open
       a picker for an input that has display:none, even when a button clicks it. */
    .visually-hidden{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;
      overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);
      white-space:nowrap;border:0;
    }
    .pickrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .pick{
      display:inline-flex;align-items:center;gap:8px;padding:10px 16px;
      border:1px dashed rgba(255,255,255,.22);border-radius:12px;cursor:pointer;
      background:rgba(0,0,0,.28);color:var(--muted);font-size:.88rem;font-weight:650;
    }
    .pick:hover:not(:disabled){color:var(--text);border-color:var(--violet)}
    .pick:disabled{opacity:.45;cursor:not-allowed}
    .shot{position:relative;display:flex;align-items:center;gap:12px;margin:18px 10px 8px;padding:12px;background:var(--sm-paper,#d8d1c2);border:1px solid #918878;transform:rotate(-1.7deg);box-shadow:3px 4px 0 rgba(0,0,0,.32)}
    .shot::before{content:"";position:absolute;top:-9px;left:38%;width:84px;height:18px;background:rgba(164,123,54,.42);transform:rotate(2deg)}
    .shot img{width:76px;height:76px;object-fit:cover;border-radius:10px;
      border:1px solid var(--line-soft);background:#000}
    .shot-meta{font-size:.78rem;color:var(--faint);line-height:1.4}
    /* Never display:none a file input. Several Android browsers refuse to open
       the picker for an input that is not in the layout, which is exactly the
       "the button does nothing" failure this page used to have. */
    .pad{
      width:100%;aspect-ratio:1 / 1;border-radius:16px;display:block;
      border:1px solid rgba(111,29,36,.42);background:#101018;
      touch-action:none;cursor:crosshair;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 14px 32px rgba(0,0,0,.2);
    }
    .padbar{display:grid;gap:8px;margin-top:12px}
    .swatches{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;width:100%}
    .swatch{
      width:100%;aspect-ratio:1;height:auto;padding:0;border-radius:50%;cursor:pointer;
      border:2px solid rgba(255,255,255,.18);background:#fff;
    }
    .swatch[aria-pressed=true]{border-color:#fff;transform:scale(1.14)}
    .nibs{display:flex;gap:6px;align-items:center}
    .nib{
      width:38px;height:32px;padding:0;border-radius:9px;display:grid;place-items:center;
      background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--muted);cursor:pointer;
    }
    .nib svg{display:block;width:21px;height:21px}
    .nib[aria-pressed=true]{border-color:var(--violet);background:rgba(111,29,36,.2);color:#fff}
    .ink-actions{display:flex;gap:8px;flex-wrap:wrap}

    .composer-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    button{
      padding:11px 20px;border:none;border-radius:999px;cursor:pointer;
      font:inherit;font-weight:750;font-size:.92rem;color:#fff;
      background:linear-gradient(135deg,var(--violet),var(--pink));
    }
    button:disabled{opacity:.45;cursor:not-allowed}
    button.ghost{background:none;border:1px solid var(--line);color:var(--muted);
      padding:7px 14px;font-size:.82rem}
    button.ghost:hover:not(:disabled){color:var(--text);border-color:rgba(255,255,255,.28)}

    .status{font-size:.84rem;color:var(--muted);min-height:1.2em}
    .status.ok{color:var(--green)}
    .status.error{color:var(--danger)}

    .meter{display:grid;gap:10px}
    .meter-row{display:grid;gap:6px}
    .meter-head{display:flex;justify-content:space-between;font-size:.78rem;color:var(--faint)}
    .meter-track{height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
    .meter-fill{height:100%;width:0;border-radius:999px;
      background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .35s ease}

    .post{
      border:1px solid var(--line-soft);border-radius:16px;padding:14px;
      background:rgba(18,20,30,.7);display:grid;gap:10px;
    }
    .post-head{display:flex;justify-content:space-between;gap:10px;
      font-size:.75rem;color:var(--faint);font-variant-numeric:tabular-nums}
    .post-text{white-space:pre-wrap;overflow-wrap:break-word;margin:0}
    .post-text .type-letter{display:inline-block}
    .post-text .type-word{white-space:nowrap}
    .post-text .type-letter.type-drop{transform:translateY(1px) rotate(-.35deg)}
    .post-text .type-letter.type-lift{transform:translateY(-1px) rotate(.35deg)}
    .media{border-radius:12px;overflow:hidden;border:1px solid var(--line-soft);
      background:#000}
    /* height:auto, not a max-height cap with object-fit:contain -- that
       height-capped a portrait photo and centred it, so the picture rendered
       narrower than the post's own text. Full content width, natural height. */
    .media img{display:block;width:100%;height:auto}

    .empty{text-align:center;padding:34px 12px;color:var(--muted)}
    .more{display:grid;place-items:center;padding:6px 0}
    footer{color:var(--faint);font-size:.76rem;text-align:center;padding-top:6px}
  </style>
</head>
<body class="board-page">
  <main>
    <header class="saint-header">
      <details class="nav-menu">
        <summary aria-label="Open menu">
          <img class="brand-mark" src="assets/logo-candle.png" alt="">
        </summary>
        <nav class="nav-menu-list" aria-label="Badge navigation">
          <a href="/notes">Field Notes</a>
          <a href="/led">LED Tools</a>
          <a href="/nfc">NFC Tools</a>
          <a href="/nfc-log">NFC Log</a>
          <a href="/usb">USB Tools</a>
          <a href="/ducky">DuckyScript</a>
          <a href="/badusb">BadUSB</a>
          <a href="/terminal">Terminal</a>
          <a href="/network">Network</a>
        </nav>
      </details>
      <div class="header-page-title"><h1>Field Notes</h1></div>
      <details class="nav-menu nav-menu--right">
        <summary aria-label="Open menu">
          <img class="brand-mark" src="assets/logo-candle.png" alt="">
        </summary>
        <nav class="nav-menu-list" aria-label="Badge navigation">
          <a href="/notes">Field Notes</a>
          <a href="/led">LED Tools</a>
          <a href="/nfc">NFC Tools</a>
          <a href="/nfc-log">NFC Log</a>
          <a href="/usb">USB Tools</a>
          <a href="/ducky">DuckyScript</a>
          <a href="/badusb">BadUSB</a>
          <a href="/terminal">Terminal</a>
          <a href="/network">Network</a>
        </nav>
      </details>
    </header>
    <section class="hall">
      <div id="postList">
        <div class="empty" id="feedEmpty">Loading…</div>
      </div>
    </section>

    <div class="more"><button class="ghost" id="loadMore" type="button" hidden>See all</button></div>

    <section class="card">
      <form id="composer">
        <div class="mode-tabs" role="group" aria-label="Note type">
          <button class="mode-button active" type="button" aria-pressed="true" data-mode="draw">Draw</button>
          <button class="mode-button" type="button" aria-pressed="false" data-mode="write">Write</button>
          <button class="mode-button" id="pickImage" type="button" aria-label="Choose an image">Image</button>
        </div>
        <div class="paper-editor">
          <div class="paper-surface">
            <canvas id="pad" class="pad" width="512" height="512" aria-label="Drawing area"></canvas>
            <textarea class="paper-text" id="text" maxlength="280" aria-label="Your message" dir="auto" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
          </div>
        </div>
        <div class="padbar">
          <div class="swatches" id="swatches"></div>
          <div class="nibs" id="nibs"></div>
          <div class="ink-actions">
            <button class="ghost" id="padUndo" type="button">Undo</button>
            <button class="ghost" id="padClear" type="button">Clear</button>
            <button class="ghost" id="dropImage" type="button" hidden>Remove image</button>
          </div>
        </div>
        <span id="padMeta" class="visually-hidden">empty</span>
        <div class="field-foot"><span id="textCount">0 / 280</span></div>
        <input id="imageInput" class="visually-hidden" type="file" accept="image/*" aria-label="Choose an image">

        <div class="composer-actions">
          <button id="submit" type="submit">Post</button>
          <span class="status" id="composerStatus" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <section class="card meter">
      <div class="meter-row">
        <div class="meter-head"><span>Storage</span><span id="meterCount">—%</span></div>
        <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      </div>
      <div id="imageNote"></div>
    </section>
    <footer class="saint-footer">
      <span class="footer-identity">SANTAMUERTE.LOCAL // ESP32 // 10.69.4.20</span>
      <div class="footer-language"></div>
    </footer>
  </main>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const feed = $('postList');
    const state = {before:0, more:true, loading:false};
    let authorId;
    try { authorId = localStorage.getItem('santa-muerte-author'); } catch (_) {}
    if (!/^[1-9][0-9]{3}$/.test(authorId || '')) {
      const random = new Uint32Array(1);
      crypto.getRandomValues(random);
      authorId = String(1000 + random[0] % 9000);
      try { localStorage.setItem('santa-muerte-author', authorId); } catch (_) {}
    }

    // Every letter is its own inline-block so it can sit a little off the line,
    // which also means the browser may break a line between any two of them --
    // "parpadea" came out as "parpade/a" once notes were no longer full width.
    // Letters are therefore grouped into words that refuse to break, leaving
    // the spaces between them as the only place a line can end.
    function typewriter(node, text) {
      node.replaceChildren();
      let word = null;
      let index = 0;
      for (const character of text) {
        const letter = document.createElement('span');
        letter.className = 'type-letter';
        letter.textContent = character;
        // Jitter follows the letter's place in the whole line rather than in
        // its word, so grouping changes where lines break and nothing else.
        if (index % 7 === 0) letter.classList.add('type-drop');
        if (index % 11 === 0) letter.classList.add('type-lift');
        index++;

        if (/\s/.test(character)) {
          word = null;
          node.appendChild(letter);
          continue;
        }
        if (!word) {
          word = document.createElement('span');
          word.className = 'type-word';
          node.appendChild(word);
        }
        word.appendChild(letter);
      }
    }
    function labelAuthor(node) {
      const english = window.PortalLocale?.locale === 'en-US';
      const anon = english ? 'Anonymous' : 'Anonymous';
      const id = node.dataset.authorId;
      // The name is the device when the badge could work one out, and falls
      // back to Anonymous when it could not -- a request relayed through a
      // router, or a client whose User-Agent names nothing.
      const name = node.dataset.authorName || anon;
      // 1 and 2 match NFC_CAPTURE_AUTHOR_ID / USB_CONSOLE_AUTHOR_ID in
      // src/board.h, both below the 1000-9999 browser pseudonym range.
      const TRANSPORT = {'1': 'NFC', '2': 'USB'};
      // The parenthesis identifies which one: the transport for a note the
      // badge made itself, otherwise the last octet of the poster's MAC. The
      // 4-digit pseudonym is the last resort, for a client whose MAC the badge
      // could not resolve. All of this is RAM-only and resets on reboot.
      const tag = TRANSPORT[id] || node.dataset.authorMac || (id !== '0' ? id : '');
      typewriter(node, tag ? `${name} (${tag})` : name);
    }
    document.addEventListener('portal-locale-change', () => {
      document.querySelectorAll('[data-author-id]').forEach(labelAuthor);
      document.querySelectorAll('[data-created-at]').forEach(node => {
        typewriter(node, window.PortalLocale.convert(formatWhen(Number(node.dataset.createdAt)), window.PortalLocale.locale));
      });
    });

    // Must match BOARD_MAX_IMAGE_BYTES in src/board.h. The badge has no image
    // codec and no memory to run one, so every pixel of resizing happens here
    // and it only ever receives something already small enough to store.
    const MAX_IMAGE_BYTES = 12288;
    const MAX_EDGE = 384;
    // The floor both shrinkers fall back to before giving up. A JPEG this
    // small cannot fail to fit under MAX_IMAGE_BYTES, so "too complex to
    // compact" stops being something a busy drawing or a detailed photo can
    // actually hit -- it only ever costs sharpness, never the note itself.
    const MIN_IMAGE_EDGE = 24;

    const PAD_BACKGROUND = '#ebe5d8';
    // Bright, familiar marker hues still reproduce cleanly against the warm
    // paper. White is a real ink, with the same geometry as every other pen.
    const PAD_COLORS = [
      '#1d2530', // black ink
      '#e33a4f', // red
      '#ff861c', // orange
      '#ffd43b', // yellow
      '#26a65b', // green
      '#00a6a6', // cyan
      '#1469d8', // blue
      '#8b43d6', // violet
      '#f8f8f2' // white
    ];
    // Three genuinely different implements rather than three widths of the
    // same one. They are spread far apart on purpose: the pen is for writing
    // and detail, the brush is for painting, the highlighter is for covering
    // ground. Each behaves the way its real counterpart does.
    //   flex  how much the nib swells and starves, as a fraction of size
    //   drag  how quickly a fast stroke starves it (mouse/finger only)
    //   lag   how heavily the width is smoothed between samples
    //   film  lay the whole stroke down as one even film (see paintFilmStroke)
    const PAD_TOOLS = [
      {
        id:'pen', label:'Pen', size:7, opacity:1,
        flex:.16, drag:.5, lag:.5, step:.7,
        // A hard round ball point. Solid ink, so retracing changes nothing.
        icon:'M4 20l1.1-3.8L15.6 5.6a1.7 1.7 0 012.4 0l.4.4a1.7 1.7 0 010 2.4L7.8 18.9 4 20z M14.6 6.6l2.8 2.8'
      },
      {
        id:'brush', label:'Brush', size:30, opacity:.9,
        flex:.45, drag:.28, lag:.72, step:1.1,
        // A loaded flat brush: a dark core with bristle streaks either side,
        // building up where it is worked over.
        bristles:[-.32, 0, .32], bristleWidth:.52,
        icon:'M17.4 2.9l2.2 2.2-8.5 8.5-2.2-2.2z M8.2 10.7l3.6 3.6-1.4 1.4-3.6-3.6z ' +
          'M6.8 12.1c-2.3.9-3.3 3.4-3.8 6.4-.2 1.3.6 2.2 1.9 1.9 3-.6 5.2-1.8 5.5-4.1z'
      },
      {
        id:'marker', label:'Highlighter', size:56, opacity:.42,
        // A rigid felt chisel: no pressure response at all, and a single even
        // film of ink no matter how many times a stroke crosses itself.
        flex:0, lag:0, step:.9, film:true, chisel:-Math.PI / 5, chiselWidth:.3,
        icon:'M9.4 3.4h5.2v8.2H9.4z M9.4 11.6h5.2l-1.3 3.4h-2.6z M3.5 19.6h17'
      }
    ];
    const padTool = id => PAD_TOOLS.find(tool => tool.id === id) || PAD_TOOLS[0];
    // The pad is square only while it is blank paper. A picked photo reshapes
    // it, so the drawing surface IS the photo rather than a square window onto
    // it -- which is what used to crop, and what left letterbox bars once the
    // crop was removed. The longest edge is held at PAD_EDGE so the drawing
    // resolution does not depend on how big the photo happened to be.
    const PAD_EDGE = 512;

    let pendingImage = null;
    let padImage = null;
    let strokes = [];
    let penColor = PAD_COLORS[0];
    let penTool = PAD_TOOLS[0];
    let activeMode = 'draw';
    let paperOrigin = {x:26, y:24};
    let paperCursor = {x:26, y:24, offset:0};

    // Android only exposes pull-to-refresh when the document is already at
    // its top edge. Cancel that downward overscroll there; a page that is
    // scrolled lower keeps its normal scrolling behavior.
    let touchStartY = 0;
    document.addEventListener('touchstart', event => {
      if (event.touches.length === 1) touchStartY = event.touches[0].clientY;
    }, {passive:true});
    document.addEventListener('touchmove', event => {
      if (event.touches.length !== 1) return;
      const scrollTop = document.scrollingElement?.scrollTop ?? window.scrollY;
      const pullingDown = event.touches[0].clientY > touchStartY;
      if (scrollTop <= 0 && pullingDown && event.cancelable) event.preventDefault();
    }, {passive:false});

    function setStatus(node, message, kind = '') {
      node.textContent = message;
      node.className = `status ${kind}`.trim();
    }

    function countField(inputId, outId, max) {
      const input = $(inputId), out = $(outId);
      const update = () => {
        out.textContent = `${input.value.length} / ${max}`;
        out.classList.toggle('over', input.value.length > max);
      };
      input.addEventListener('input', update);
      if (inputId === 'text') input.addEventListener('input', redrawPad);
      update();
    }

    function formatWhen(seconds) {
      if (!seconds) return 'unknown time';
      const then = new Date(seconds * 1000);
      if (Number.isNaN(then.getTime())) return 'unknown time';
      const delta = (Date.now() - then.getTime()) / 1000;
      if (delta < 0) return then.toLocaleString();
      if (delta < 60) return 'now';
      if (delta < 3600) return `hace ${Math.floor(delta / 60)} min`;
      if (delta < 86400) return `hace ${Math.floor(delta / 3600)} h`;
      return then.toLocaleDateString(undefined, {month:'short', day:'numeric'});
    }

    const formatBytes = n => n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`;

    // Decode with EXIF orientation when the browser supports it, then fall
    // back to an image element for older WebViews.
    async function decodeImage(file) {
      if (typeof createImageBitmap === 'function') {
        for (const options of [{imageOrientation:'from-image'}, undefined]) {
          try {
            const bitmap = await createImageBitmap(file, options);
            return {
              source: bitmap,
              width: bitmap.width,
              height: bitmap.height,
              release: () => bitmap.close?.()
            };
          } catch { /* try the next strategy */ }
        }
      }

      const url = URL.createObjectURL(file);
      try {
        const image = new Image();
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () => reject(new Error('That file is not an image.'));
          image.src = url;
        });
        return {
          source: image,
          width: image.naturalWidth || image.width,
          height: image.naturalHeight || image.height,
          release: () => URL.revokeObjectURL(url)
        };
      } catch (error) {
        URL.revokeObjectURL(url);
        throw error;
      }
    }

    function canvasToBlob(canvas, quality) {
      return new Promise(resolve => {
        if (canvas.toBlob) {
          canvas.toBlob(resolve, 'image/jpeg', quality);
          return;
        }
        // Older WebViews have toDataURL but not toBlob.
        try {
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const binary = atob(dataUrl.slice(dataUrl.indexOf(',') + 1));
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          resolve(new Blob([bytes], {type:'image/jpeg'}));
        } catch {
          resolve(null);
        }
      });
    }

    // Resize and compress a picked photo to the same small JPEG format used by
    // the drawing canvas before it crosses the badge connection.
    async function shrinkImage(file) {
      const decoded = await decodeImage(file);
      if (!decoded.width || !decoded.height) {
        decoded.release();
        throw new Error('The browser could not read the image.');
      }

      try {
        let edge = MAX_EDGE;
        while (true) {
          const scale = Math.min(1, edge / Math.max(decoded.width, decoded.height));
          const width = Math.max(1, Math.round(decoded.width * scale));
          const height = Math.max(1, Math.round(decoded.height * scale));

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext('2d');
          context.imageSmoothingQuality = 'high';
          context.drawImage(decoded.source, 0, 0, width, height);

          for (const quality of [0.6, 0.45, 0.32, 0.22, 0.15, 0.08]) {
            const blob = await canvasToBlob(canvas, quality);
            if (blob && blob.size <= MAX_IMAGE_BYTES) return {blob, width, height};
          }
          if (edge <= MIN_IMAGE_EDGE) return null;
          edge = Math.max(MIN_IMAGE_EDGE, Math.round(edge * 0.7));
        }
      } finally {
        decoded.release();
      }
    }

    function clearPendingImage() {
      if (pendingImage?.url) URL.revokeObjectURL(pendingImage.url);
      pendingImage = null;
      $('imageInput').value = '';
      $('dropImage').hidden = true;
      resizePad(PAD_EDGE, PAD_EDGE);   // blank paper is square again
    }

    function loadCanvasPhoto(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.addEventListener('load', () => resolve(image), {once:true});
        image.addEventListener('error', () => reject(new Error('Could not read the image.')), {once:true});
        image.src = url;
      });
    }

    async function choosePicture(file) {
      if (!file) return;
      const status = $('composerStatus');
      setStatus(status, 'Shrinking the image…');
      try {
        const shrunk = await shrinkImage(file);
        if (!shrunk) throw new Error('The image is still too big.');

        if (pendingImage?.url) URL.revokeObjectURL(pendingImage.url);
        const url = URL.createObjectURL(shrunk.blob);
        const image = await loadCanvasPhoto(url);
        pendingImage = {...shrunk, url, image};
        padImage = null;
        resizePad(...padShapeForPhoto(shrunk.width, shrunk.height));
        redrawPad();
        $('dropImage').hidden = false;
        setStatus(status, '');
        schedulePadRender();
      } catch (error) {
        clearPendingImage();
        setStatus(status, error.message || 'Could not read the image.', 'error');
      }
    }

    // ---- drawing pad ----------------------------------------------------
    const pad = $('pad');
    const paperText = $('text');

    // Strokes and the paper caret are stored in pad pixels, so a resize has to
    // carry them across or existing ink would jump.
    function resizePad(width, height) {
      if (pad.width === width && pad.height === height) return;
      const sx = width / pad.width;
      const sy = height / pad.height;
      const sn = (sx + sy) / 2;
      for (const stroke of strokes) {
        stroke.size *= sn;
        for (const point of stroke.points) {
          point.x *= sx;
          point.y *= sy;
          if (point.width) point.width *= sn;
        }
      }
      paperOrigin = {x: paperOrigin.x * sx, y: paperOrigin.y * sy};
      paperCursor = {x: paperCursor.x * sx, y: paperCursor.y * sy, offset: paperCursor.offset};
      pad.width = width;
      pad.height = height;
      pad.style.aspectRatio = `${width} / ${height}`;
      redrawPad();
    }

    function padShapeForPhoto(width, height) {
      const scale = PAD_EDGE / Math.max(width, height);
      return [Math.max(1, Math.round(width * scale)), Math.max(1, Math.round(height * scale))];
    }

    function padContext() {
      const context = pad.getContext('2d');
      context.lineCap = 'round';
      context.lineJoin = 'round';
      return context;
    }

    function paperTextLayout(context, origin = paperOrigin) {
      const value = paperText.value;
      context.font = '700 24px "Courier New", monospace';
      const lineHeight = 34;
      const maxWidth = Math.max(64, pad.width - origin.x - 26);
      const lines = [];
      let line = '';
      let lineStart = 0;
      let index = 0;

      const pushLine = (text, start, end) => {
        lines.push({
          text,
          start,
          end,
          x: origin.x,
          y: origin.y + lines.length * lineHeight,
        });
      };

      while (index < value.length) {
        const codePoint = value.codePointAt(index);
        const character = String.fromCodePoint(codePoint);
        const characterLength = character.length;

        if (character === '\n') {
          pushLine(line, lineStart, index);
          line = '';
          index += characterLength;
          lineStart = index;
          continue;
        }

        const candidate = line + character;
        if (line && context.measureText(candidate).width > maxWidth) {
          pushLine(line, lineStart, index);
          line = character;
          lineStart = index;
        } else {
          line = candidate;
        }
        index += characterLength;
      }
      pushLine(line, lineStart, value.length);
      return lines;
    }

    function renderPaperText(context) {
      if (!paperText.value) return;

      context.fillStyle = '#171717';
      context.textBaseline = 'top';
      let letterIndex = 0;

      for (const line of paperTextLayout(context)) {
        let x = line.x;
        for (const character of line.text) {
          context.save();
          if (letterIndex % 7 === 0) context.translate(0, 1);
          if (letterIndex % 11 === 0) context.rotate(.006);
          context.fillText(character, x, line.y);
          context.restore();
          x += context.measureText(character).width;
          letterIndex++;
        }
      }
    }

    function renderPaperCaret(context) {
      if (activeMode !== 'write' || document.activeElement !== paperText) return;
      context.strokeStyle = '#6f1d24';
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(paperCursor.x, paperCursor.y - 2);
      context.lineTo(paperCursor.x, paperCursor.y + 28);
      context.stroke();
    }

    function placePaperCaret(event) {
      const context = padContext();
      const lines = paperTextLayout(context);
      const rect = pad.getBoundingClientRect();
      const scaleX = pad.width / rect.width;
      const scaleY = pad.height / rect.height;
      const x = Math.max(0, Math.min(pad.width, (event.clientX - rect.left) * scaleX));
      const y = Math.max(0, Math.min(pad.height, (event.clientY - rect.top) * scaleY));
      const lineHeight = 34;
      const lineIndex = Math.max(0, Math.min(lines.length - 1,
        Math.floor((y - paperOrigin.y + lineHeight / 2) / lineHeight)));
      const line = lines[lineIndex];

      let offset = line.start;
      let cursorX = line.x;
      for (const character of line.text) {
        const width = context.measureText(character).width;
        if (x < cursorX + width / 2) break;
        cursorX += width;
        offset += character.length;
      }

      const lineRight = line.x + context.measureText(line.text).width;
      const clickedText = Boolean(paperText.value) &&
        y >= line.y - 8 && y <= line.y + lineHeight &&
        x >= line.x - 12 && x <= lineRight + 12;

      if (!clickedText) {
        // Blank paper is a real insertion point, not just an invisible
        // textarea. New writing begins exactly where the strip was tapped.
        paperOrigin = {
          x: Math.max(26, Math.min(pad.width - 26, x)),
          y: Math.max(24, Math.min(pad.height - 34, y)),
        };
        offset = paperText.value.length;
        cursorX = paperOrigin.x;
      }

      paperCursor = {x:cursorX, y:clickedText ? line.y : paperOrigin.y, offset};

      paperText.focus({preventScroll:true});
      paperText.setSelectionRange(offset, offset);
      redrawPad();
    }

    function redrawPad() {
      const context = padContext();
      context.fillStyle = PAD_BACKGROUND;
      context.fillRect(0, 0, pad.width, pad.height);

      if (pendingImage?.image) {
        // Contain, not cover. Cover filled the square by scaling to the LONGER
        // edge and letting the rest fall outside the canvas, which silently
        // cropped every photo that was not already square -- including the
        // parts the preview never showed.
        const {image} = pendingImage;
        const scale = Math.min(pad.width / image.naturalWidth, pad.height / image.naturalHeight);
        const width = image.naturalWidth * scale;
        const height = image.naturalHeight * scale;
        context.drawImage(image, (pad.width - width) / 2, (pad.height - height) / 2, width, height);
      }

      // Text is painted first. Drawing strokes are painted afterward so the
      // same strip can be written on, crossed out, or annotated PictoChat-style.
      renderPaperText(context);

      for (const stroke of strokes) replayStroke(context, stroke);

      renderPaperCaret(context);
    }

    // ---- nibs ------------------------------------------------------------
    // Scratch canvases the size of the pad. A highlighter needs somewhere to
    // build its stroke opaque before it is faded, and the live stroke needs a
    // snapshot of everything underneath it to redraw against.
    const padLayers = {};
    function padLayer(name) {
      const layer = padLayers[name] || (padLayers[name] = document.createElement('canvas'));
      if (layer.width !== pad.width || layer.height !== pad.height) {
        layer.width = pad.width;
        layer.height = pad.height;
      }
      return layer.getContext('2d');
    }

    // How wide the nib runs right now, as a multiple of the tool's size. A pen
    // barely varies, a brush loads and starves dramatically, and a felt chisel
    // is rigid and never varies at all.
    function nibScale(tool, pressure, speed) {
      if (!tool.flex) return 1;
      const drive = pressure === null ? Math.max(0, 1 - speed * tool.drag) : pressure;
      return Math.max(.3, 1 + tool.flex * (drive - .5) * 2);
    }

    function replayStroke(context, stroke) {
      const points = stroke.points;
      if (points.length === 1) {
        paintStroke(context, stroke, () => paintSegment(context, stroke, points[0], points[0]));
        return;
      }
      paintStroke(context, stroke, () => {
        for (let i = 1; i < points.length; i++) {
          paintSegment(context, stroke, points[i - 1], points[i]);
        }
      });
    }

    // A highlighter lays down ONE film of ink: crossing your own stroke must
    // not darken it, the way a second pass with a real marker does not. So its
    // whole stroke is built opaque on a scratch layer and composited once.
    // Everything else paints straight onto the pad as it is drawn.
    function paintStroke(context, stroke, paint) {
      const tool = padTool(stroke.tool);
      if (!tool.film) {
        paint();
        return;
      }
      const film = padLayer('film');
      film.clearRect(0, 0, pad.width, pad.height);
      filmTarget = film;
      try { paint(); } finally { filmTarget = null; }
      layFilm(context, stroke, film.canvas);
    }

    // Marker ink tints what it crosses instead of washing it out, which is the
    // whole point of a highlighter -- pen lines stay readable underneath. White
    // is the exception: multiplying it would erase the stroke entirely, so it
    // goes down as an ordinary translucent wash.
    function layFilm(context, stroke, canvas) {
      context.save();
      context.globalAlpha = padTool(stroke.tool).opacity;
      if (!isPaleInk(stroke.color)) context.globalCompositeOperation = 'multiply';
      context.drawImage(canvas, 0, 0);
      context.restore();
    }

    function isPaleInk(color) {
      const hex = parseInt(color.slice(1), 16);
      return (((hex >> 16 & 255) * .299 + (hex >> 8 & 255) * .587 + (hex & 255) * .114) / 255) > .8;
    }

    // Set while a film stroke is being built, so paintSegment writes to the
    // scratch layer at full strength rather than onto the pad.
    let filmTarget = null;

    // Each new segment is drawn on its own rather than replaying every stroke,
    // so a long scribble does not get slower the longer it gets.
    function paintSegment(context, stroke, from, to) {
      const tool = padTool(stroke.tool);
      const surface = filmTarget || context;
      const distance = Math.hypot(to.x - from.x, to.y - from.y);
      const steps = Math.max(1, Math.ceil(distance / tool.step));
      surface.save();
      surface.fillStyle = stroke.color;

      if (tool.film) {
        // A chisel tip never changes shape, so the whole segment can go down as
        // one path: on the film layer overlapping stamps simply union.
        const nx = Math.cos(tool.chisel), ny = Math.sin(tool.chisel);
        const hx = nx * stroke.size / 2, hy = ny * stroke.size / 2;
        const tx = -ny * stroke.size * tool.chiselWidth / 2;
        const ty = nx * stroke.size * tool.chiselWidth / 2;
        surface.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const x = from.x + (to.x - from.x) * t, y = from.y + (to.y - from.y) * t;
          surface.moveTo(x - hx - tx, y - hy - ty);
          surface.lineTo(x + hx - tx, y + hy - ty);
          surface.lineTo(x + hx + tx, y + hy + ty);
          surface.lineTo(x - hx + tx, y - hy + ty);
          surface.closePath();
        }
        surface.fill();
        surface.restore();
        return;
      }

      // Bristles ride either side of the stroke, across its direction of
      // travel, so a brush leaves streaks at its edges and solid ink down the
      // middle. A pen is a single round ball with no spread at all.
      const bristles = tool.bristles || [0];
      const spread = tool.bristleWidth || 1;
      const length = Math.max(.0001, distance);
      const ax = -(to.y - from.y) / length, ay = (to.x - from.x) / length;

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const width = (from.width || stroke.size) * (1 - t) + (to.width || stroke.size) * t;
        const x = from.x + (to.x - from.x) * t, y = from.y + (to.y - from.y) * t;
        // A line is built from many overlapping nib stamps. Split the intended
        // stroke opacity across those stamps, otherwise one ordinary pass
        // would build itself up to solid ink before someone draws over it. The
        // divisor is the bristle's own diameter, not the stroke's: a bundle of
        // thin bristles is crossed by far fewer stamps than a single fat nib.
        surface.globalAlpha = 1 - Math.pow(1 - stroke.opacity, 1 / Math.max(1, width * spread));
        surface.beginPath();
        for (const offset of bristles) {
          const radius = width * spread / 2;
          surface.moveTo(x + ax * offset * width + radius, y + ay * offset * width);
          surface.arc(x + ax * offset * width, y + ay * offset * width, radius, 0, Math.PI * 2);
        }
        surface.fill();
      }
      surface.restore();
    }

    function padPoint(event) {
      const rect = pad.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (pad.width / rect.width),
        y: (event.clientY - rect.top) * (pad.height / rect.height),
        time: event.timeStamp,
        pressure: event.pointerType === 'pen' ? Math.max(.1, event.pressure) : null
      };
    }

    // A photo with nothing drawn or written on it is a note in its own
    // right and keeps its own proportions. The square pad is only the right
    // thing to store for a composite: strokes and paper text are positioned in
    // pad coordinates and mean nothing detached from it.
    function photoStandsAlone() {
      return Boolean(pendingImage) && strokes.length === 0 && !paperText.value.trim();
    }

    // Resolving false leaves the note on the wall, so a refused delete shows
    // as the note simply staying put plus a line in the status.
    async function deletePost(id) {
      try {
        const response = await fetch('/api/board/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: `id=${encodeURIComponent(id)}`
        });
        const state = await response.json().catch(() => ({}));
        if (!response.ok || !state.ok) {
          setStatus($('composerStatus'), state.message || 'Could not delete that note.', 'error');
          return false;
        }
        updateMeter(state);
        // The wall has one fewer note, so a column may now have room for one
        // that was being held back.
        window.setTimeout(() => {
          if (!feed.querySelector('.post')) showEmpty('No notes yet');
          else topUpWall();
        }, 260);
        return true;
      } catch (_) {
        setStatus($('composerStatus'), 'Could not reach the badge.', 'error');
        return false;
      }
    }

    let padTimer = 0;
    function schedulePadRender() {
      clearTimeout(padTimer);
      padTimer = setTimeout(renderPadImage, 350);
    }

    async function renderPadImage() {
      if (!strokes.length && !pendingImage) {
        padImage = null;
        $('padMeta').textContent = 'empty';
        return;
      }

      if (photoStandsAlone()) {
        // shrinkImage() already fitted this inside MAX_EDGE and MAX_IMAGE_BYTES
        // without altering its proportions, so there is nothing left to do and
        // no reason to re-encode it through the square canvas.
        padImage = null;
        $('padMeta').textContent =
          `${pendingImage.width}×${pendingImage.height} JPEG, ${formatBytes(pendingImage.blob.size)}`;
        return;
      }

      // A busy square can carry far more detail than the fixed 12 KiB ring
      // accepts. Work down through dimensions as well as JPEG quality, all the
      // way to MIN_IMAGE_EDGE, so an energetic scribble remains a note
      // rather than disappearing -- it only ever loses sharpness, never gets
      // rejected outright.
      for (let edge = MAX_EDGE; ; edge = Math.max(MIN_IMAGE_EDGE, Math.floor(edge * .65))) {
        const exportPad = document.createElement('canvas');
        const scale = Math.min(1, edge / Math.max(pad.width, pad.height));
        exportPad.width = Math.max(1, Math.round(pad.width * scale));
        exportPad.height = Math.max(1, Math.round(pad.height * scale));
        exportPad.getContext('2d').drawImage(pad, 0, 0, exportPad.width, exportPad.height);

        for (const quality of [.72, .58, .44, .3, .2, .12, .07, .04]) {
          const blob = await canvasToBlob(exportPad, quality);
          if (blob && blob.size <= MAX_IMAGE_BYTES) {
            padImage = blob;
            $('padMeta').textContent =
              `${exportPad.width}×${exportPad.height} JPEG, ${formatBytes(blob.size)}`;
            return;
          }
        }
        if (edge <= MIN_IMAGE_EDGE) break;
      }

      padImage = null;
      $('padMeta').textContent = 'the drawing is too big';
    }

    function buildPadControls() {
      const swatches = $('swatches');
      for (const color of PAD_COLORS) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'swatch';
        button.style.setProperty('background', color, 'important');
        button.setAttribute('aria-pressed', String(color === penColor));
        button.setAttribute('aria-label', `Dibujar en ${color}`);
        button.addEventListener('click', () => {
          penColor = color;
          for (const other of swatches.children) {
            other.setAttribute('aria-pressed', String(other === button));
          }
        });
        swatches.appendChild(button);
      }

      const nibs = $('nibs');
      for (const tool of PAD_TOOLS) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'nib';
        button.setAttribute('aria-pressed', String(tool === penTool));
        button.setAttribute('aria-label', tool.label);
        button.setAttribute('title', tool.label);
        button.innerHTML =
          `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"` +
          ` stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">` +
          `<path d="${tool.icon}"/></svg>`;
        button.addEventListener('click', () => {
          penTool = tool;
          for (const other of nibs.children) {
            other.setAttribute('aria-pressed', String(other === button));
          }
        });
        nibs.appendChild(button);
      }
    }

    function wirePad() {
      let drawing = false;

      // Some Android captive-portal WebViews do not honour touch-action on a
      // canvas until a native touch listener also consumes the gesture.
      const consumeTouch = event => event.preventDefault();
      pad.addEventListener('touchstart', consumeTouch, {passive:false});
      pad.addEventListener('touchmove', consumeTouch, {passive:false});
      pad.addEventListener('touchend', consumeTouch, {passive:false});
      pad.addEventListener('touchcancel', consumeTouch, {passive:false});

      pad.addEventListener('pointerdown', event => {
        event.preventDefault();
        pad.setPointerCapture(event.pointerId);
        drawing = true;
        const tool = penTool;
        const point = padPoint(event);
        // A mouse reports no pressure, and a stroke that has not moved yet has
        // no speed either, so the nib would otherwise land at its very widest
        // and leave a blot at the start of every stroke. Start it mid-load.
        point.width = tool.size * (point.pressure === null ? 1 : nibScale(tool, point.pressure, 0));
        // A film stroke is recomposited from scratch on every move, so set
        // aside everything beneath it first rather than replaying it each time.
        if (tool.film) {
          redrawPad();
          const under = padLayer('under');
          under.clearRect(0, 0, pad.width, pad.height);
          under.drawImage(pad, 0, 0);
        }
        strokes.push({
          tool:tool.id,
          color:penColor,
          size:tool.size,
          opacity:tool.opacity,
          points:[point]
        });
        redrawPad();
      });

      pad.addEventListener('pointermove', event => {
        if (!drawing) return;
        event.preventDefault();
        const stroke = strokes[strokes.length - 1];
        const tool = padTool(stroke.tool);
        for (const sample of (event.getCoalescedEvents?.().length ? event.getCoalescedEvents() : [event])) {
          const previous = stroke.points[stroke.points.length - 1];
          const to = padPoint(sample);
          const speed = Math.hypot(to.x - previous.x, to.y - previous.y) / Math.max(1, to.time - previous.time);
          const target = stroke.size * nibScale(tool, to.pressure, speed);
          to.width = previous.width * tool.lag + target * (1 - tool.lag);
          stroke.points.push(to);
          if (!tool.film) paintSegment(padContext(), stroke, previous, to);
        }
        if (!tool.film) return;
        // Repaint the film over the untouched layers below. Cheap, and unlike a
        // full redraw its cost does not grow with the number of strokes.
        const context = padContext();
        context.drawImage(padLayers.under, 0, 0);
        replayStroke(context, stroke);
      });

      const finish = () => {
        if (!drawing) return;
        drawing = false;
        schedulePadRender();
      };
      pad.addEventListener('pointerup', finish);
      pad.addEventListener('pointercancel', finish);

      paperText.addEventListener('pointerdown', event => {
        if (activeMode !== 'write') return;
        event.preventDefault();
        placePaperCaret(event);
      });

      // The browser may apply its native textarea selection after pointerdown.
      // Re-apply the canvas position on click so a tap never snaps the caret to
      // the end of the message.
      paperText.addEventListener('click', event => {
        if (activeMode !== 'write') return;
        event.preventDefault();
        // Let the browser finish its click bookkeeping, then put the caret
        // back at the point chosen on the canvas.
        window.setTimeout(() => placePaperCaret(event), 0);
      });

      paperText.addEventListener('input', () => {
        const context = padContext();
        const lines = paperTextLayout(context);
        const offset = paperText.selectionStart ?? paperText.value.length;
        let cursor = lines[lines.length - 1];
        for (const line of lines) {
          if (offset <= line.end) {
            cursor = line;
            break;
          }
        }
        let x = cursor.x;
        for (const character of cursor.text.slice(0, Math.max(0, offset - cursor.start))) {
          x += context.measureText(character).width;
        }
        paperCursor = {x, y:cursor.y, offset};
        redrawPad();
        schedulePadRender();
      });

      $('padUndo').addEventListener('click', () => {
        strokes.pop();
        redrawPad();
        schedulePadRender();
      });

      $('padClear').addEventListener('click', () => {
        strokes = [];
        padImage = null;
        $('text').value = '';
        paperOrigin = {x:26, y:24};
        paperCursor = {x:26, y:24, offset:0};
        $('text').dispatchEvent(new Event('input'));
        redrawPad();
        $('padMeta').textContent = 'empty';
      });
    }

    function setComposerMode(mode) {
      activeMode = mode;
      document.querySelectorAll('.mode-button[data-mode="draw"], .mode-button[data-mode="write"]').forEach(button => {
        const selected = button.dataset.mode === mode;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      $('text').classList.toggle('typing', mode === 'write');
      if (mode === 'write') {
        $('text').focus();
      } else {
        $('text').blur();
      }
      redrawPad();
    }

    function buildPost(post) {
      const article = document.createElement('article');
      article.className = `post${post.hasImage ? ' note-photo' : ' note-plain'}`;
      // Deterministic variation gives the wall its hand-pinned character while
      // ensuring a note does not change position on every refresh.
      const seed = Array.from(String(post.id || post.createdAt || '0'))
        .reduce((total, character) => (total * 31 + character.charCodeAt(0)) >>> 0, 0);
      const variation = salt => {
        let value = (seed ^ salt) >>> 0;
        value = Math.imul(value ^ (value >>> 16), 2246822507);
        value = Math.imul(value ^ (value >>> 13), 3266489909);
        return (value ^ (value >>> 16)) >>> 0;
      };
      article.style.setProperty('--note-tilt', `${((variation(0x2d) % 37 - 18) / 10).toFixed(1)}deg`);
      // Kept inside the column gap: further than this and a note leans on its
      // neighbour instead of just sitting crooked next to it.
      article.style.setProperty('--note-shift', `${variation(0x71) % 25 - 12}px`);
      article.style.setProperty('--tape-left', `${30 + variation(0xb3) % 41}%`);
      article.style.setProperty('--tape-tilt', `${((variation(0xe7) % 13 - 6) / 2).toFixed(1)}deg`);

      // The tape is the only way to take a note down. Nothing says so: you
      // find it the way you would find the tape on a real note.
      PortalTape.tape(article, {
        label: 'Take this note down',
        onDelete: () => deletePost(post.id)
      });

      const head = document.createElement('div');
      head.className = 'post-head';
      const num = document.createElement('span');
      typewriter(num, `#${String(post.id).padStart(4, '0')}`);
      const author = document.createElement('span');
      author.dataset.authorId = String(post.authorId || 0);
      if (post.authorName) author.dataset.authorName = post.authorName;
      if (post.authorMac) author.dataset.authorMac = post.authorMac;
      labelAuthor(author);
      const when = document.createElement('span');
      when.dataset.createdAt = String(post.createdAt || 0);
      typewriter(when, window.PortalLocale?.convert(formatWhen(post.createdAt), window.PortalLocale.locale) || formatWhen(post.createdAt));
      head.append(num, author, when);
      article.appendChild(head);

      if (post.hasImage) {
        const wrap = document.createElement('div');
        wrap.className = 'media';
        const image = document.createElement('img');
        image.loading = 'lazy';
        image.alt = 'Drawing posted';
        const revision = Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16)).join('-');
        image.src = `/api/board/image?id=${encodeURIComponent(post.id)}&v=${revision}`;
        // The picture may have been pruned between the listing and this fetch.
        image.addEventListener('error', () => {
          wrap.remove();
          const fallback = article.querySelector('.post-text');
          if (fallback) fallback.hidden = false;
        }, {once:true});
        wrap.appendChild(image);
        article.appendChild(wrap);
      }

      if (post.text) {
        const paragraph = document.createElement('p');
        paragraph.className = 'post-text';
        paragraph.hidden = Boolean(post.hasImage && post.textInImage);
        paragraph.dir = 'auto';
        typewriter(paragraph, post.text);
        article.appendChild(paragraph);
      }

      return article;
    }

    function updateMeter(page) {
      if (typeof page.stored !== 'number' || !page.capacity) return;
      $('meterCount').textContent = `${Math.min(100, Math.round(page.stored / page.capacity * 100))}%`;
      $('meterFill').style.width = `${Math.min(100, page.stored / page.capacity * 100)}%`;
      if (page.imageCapacity) {
        $('imageNote').textContent =
          '';
      }
    }

    function showEmpty(message) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.id = 'feedEmpty';
      empty.textContent = message;
      feed.appendChild(empty);
    }

    // The wall opens with whole columns: as many as the window fits, four notes
    // deep. A fixed count could not know how wide the board was, so "the latest
    // five" ran out mid-column on a wide screen and overfilled a narrow one.
    const NOTES_PER_COLUMN = 4;

    function wallColumns() {
      const style = getComputedStyle(feed);
      // column-width reads as "auto" until the wall's stylesheet has applied;
      // fall back to the width theme.css asks for rather than guessing one.
      const column = parseFloat(style.columnWidth) || 290;
      const gap = parseFloat(style.columnGap) || 0;
      const width = feed.clientWidth;
      if (!width) return 1;
      return Math.max(1, Math.floor((width + gap) / (column + gap)));
    }

    const firstWall = () => wallColumns() * NOTES_PER_COLUMN;

    // Measuring can come up short -- a stylesheet that has not applied yet, a
    // window that just grew -- so the wall is topped up rather than trusted to
    // one reading. Deliberately not on requestAnimationFrame: a board opened in
    // a background tab never gets a frame, and would never load at all.
    function topUpWall() {
      const wanted = firstWall();
      const showing = feed.querySelectorAll('.post').length;
      if (state.more && showing < wanted) loadPage(wanted - showing);
    }

    function refreshFeed() {
      state.before = 0;
      state.more = true;
      feed.replaceChildren();
      showEmpty('Loading…');
      loadPage(firstWall()).then(topUpWall);
    }

    async function loadPage(limit = 20) {
      if (state.loading || !state.more) return false;
      state.loading = true;
      $('loadMore').disabled = true;
      let loaded = false;

      try {
        const query = new URLSearchParams({before:String(state.before), limit:String(limit)});
        const response = await fetch(`/api/board/posts?${query}`, {cache:'no-store'});
        if (!response.ok) throw new Error('The badge is not answering.');
        const page = await response.json();
        loaded = true;

        $('feedEmpty')?.remove();
        for (const post of page.posts || []) feed.appendChild(buildPost(post));

        state.before = page.nextBefore || state.before;
        state.more = Boolean(page.more);
        updateMeter(page);

        if (!feed.children.length) {
          showEmpty('No notes yet');
        }
      } catch (error) {
        const placeholder = $('feedEmpty');
        if (placeholder) placeholder.textContent = error.message || 'Could not load the notes.';
      } finally {
        state.loading = false;
        $('loadMore').hidden = !state.more;
        $('loadMore').disabled = false;
      }

      return loaded;
    }

    async function expandList() {
      if (state.loading || !state.more) return;
      $('loadMore').disabled = true;
      $('loadMore').textContent = 'Loading…';

      while (state.more) {
        if (!await loadPage(40)) break;
      }

      $('loadMore').textContent = 'See all';
      $('loadMore').hidden = !state.more;
    }

    $('composer').addEventListener('submit', async event => {
      event.preventDefault();
      if ($('submit').disabled) return;
      $('submit').disabled = true;
      const status = $('composerStatus');
      const text = $('text').value;
      clearTimeout(padTimer);
      redrawPad();
      await renderPadImage();
      if (strokes.length && !padImage) {
        $('submit').disabled = false;
        setStatus(status, 'The drawing is too big. Try something simpler.', 'error');
        return;
      }
      const picture = photoStandsAlone() ? pendingImage.blob : (padImage || pendingImage?.blob || null);
      if (!text.trim() && !picture) {
        $('submit').disabled = false;
        setStatus(status, 'Draw, write, or do both.', 'error');
        return;
      }

      $('submit').disabled = true;
      setStatus(status, 'Sending…');

      try {
        // The drawing is the whole body, raw. Sending it as a base64 form
        // field instead made the badge's web server buffer and copy it several
        // times over before the firmware saw a byte, which overran the free
        // heap and killed the connection -- a "Failed to fetch" whenever the
        // picture got big. The metadata rides in headers so the body stays
        // pure, and skipping base64 drops a quarter of the bytes as well.
        const response = await fetch('/api/board/post', {
          method:'POST',
          headers:{
            'Content-Type':'application/octet-stream',
            'X-Note-Author':String(authorId),
            'X-Note-Text-In-Image':padImage && text ? '1' : '0',
            // A header cannot carry a newline or a raw UTF-8 byte.
            'X-Note-Text':encodeURIComponent(text),
            // The badge has no clock of its own, so it can only record what
            // this browser says the time is.
            'X-Note-Ts':String(Math.floor(Date.now() / 1000))
          },
          body: picture || new Blob()
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || 'Could not post the note.');

        $('text').value = '';
        $('text').dispatchEvent(new Event('input'));
        clearPendingImage();
        strokes = [];
        padImage = null;
        redrawPad();
        $('padMeta').textContent = 'empty';
        setStatus(status, 'Note posted.', 'ok');

        refreshFeed();
      } catch (error) {
        setStatus(status, error.message || 'Could not reach the badge.', 'error');
      } finally {
        $('submit').disabled = false;
      }
    });

    $('pickImage').addEventListener('click', () => $('imageInput').click());
    $('imageInput').addEventListener('change', event => choosePicture(event.target.files[0]));
    $('dropImage').addEventListener('click', () => {
      clearPendingImage();
      redrawPad();
      schedulePadRender();
    });
    $('loadMore').addEventListener('click', expandList);

    // Widening the window adds columns, which would otherwise stay empty until
    // the next refresh.
    let wallResize = 0;
    window.addEventListener('resize', () => {
      clearTimeout(wallResize);
      wallResize = setTimeout(topUpWall, 250);
    });
    document.querySelectorAll('.mode-button[data-mode="draw"], .mode-button[data-mode="write"]').forEach(button => {
      button.addEventListener('click', () => setComposerMode(button.dataset.mode));
    });

    buildPadControls();
    wirePad();
    setComposerMode(activeMode);
    redrawPad();

    countField('text', 'textCount', 280);
    loadPage(firstWall()).then(topUpWall);
  })();
  </script>
</body>
</html>
